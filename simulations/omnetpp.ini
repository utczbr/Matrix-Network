# =============================================================================
# Matrix Factory Twin - Six-Cell Comparison (P2/P3 Locked Configuration)
# OMNeT++ 6.4.0 / INET 4.7.0 (commit dfe270b21f)
# Revision: Oct 14, 2026 (Q1-Q8 Locked)
#
#   Wired Backbone      x  Radio Access Regime
#   ---------------------------------------------------------------------------
#   FIFO       (Cell1)     CSMA/CA   (Cell1, Cell3, Cell5)
#   802.1Q prio(Cell3)     Scheduled (Cell2, Cell4, Cell6) <- Spike S1 (ScheduledDcf)
#   802.1Qbv   (Cell5)
# =============================================================================

[General]
network = MatrixFactoryNetwork
sim-time-limit = 60s
warmup-period = 5s

# RNG Isolation (Checklist C8):
# rng-0: Wireless MAC / protocol state machines
# rng-1: Application traffic generators (offered load parity across cells)
# rng-2: AMR initial spatial placement (geometric parity between CSMA and Sched)
num-rngs = 3
**.app[*].source.rng-0 = 1
*.amr[*].mobility.rng-0 = 2

**.mgmt.numChannels = 2

# ---- Addressing: single flat L2 broadcast domain ----------------------------
*.configurator.config = xml("<config><interface hosts='*' address='10.0.x.x' netmask='255.255.0.0'/></config>")
*.configurator.assignDisjunctSubnetAddresses = false

# ---- Wireless environment: 200m x 200m hall, 60m x 60m AMR core (no hidden nodes)
**.constraintAreaMinX = 0m
**.constraintAreaMinY = 0m
**.constraintAreaMinZ = 0m
**.constraintAreaMaxX = 200m
**.constraintAreaMaxY = 200m
**.constraintAreaMaxZ = 0m
**.initFromDisplayString = false
*.ap.mobility.initialX = 100m
*.ap.mobility.initialY = 100m
*.ap.mobility.initialZ = 0m
*.amr[*].mobility.typename = "StationaryMobility"
*.amr[*].mobility.initialX = 100m + uniform(-30m, 30m)
*.amr[*].mobility.initialY = 100m + uniform(-30m, 30m)
*.amr[*].mobility.initialZ = 0m

*.ap.wlan[*].address = "10:00:00:00:00:00"
*.amr[*].wlan[*].mgmt.accessPointAddress = "10:00:00:00:00:00"
**.wlan[*].opMode = "g(erp)"
**.wlan[*].radio.transmitter.power = 20mW
**.wlan[*].radio.transmitter.centerFrequency = 2.412GHz
**.wlan[*].radio.receiver.sensitivity = -85dBm
**.wlan[*].radio.receiver.snirThreshold = 4dB
*.radioMedium.backgroundNoise.power = -110dBm

# ---- Traffic Classes (Locked Q2, Q4, Q6, Q7) --------------------------------
#  Class      Direction     UDP Port   PCP   TC    Nominal Deadline (D_c)
#  orders     FMS -> AMR    5051       6     TC3   50 ms (Watchdog TTL / KILL)
#  dds        stn -> FMS    5100       4     TC2    5 ms (Watchdog TTL / KILL)
#  state      AMR -> FMS    5050       2     TC1   50 ms (Freshness / ZOH)
#  telemetry  stn -> FMS    5200       0     TC0  100 ms (Coexistence load / ZOH)

# AMRs: app[0] VDA 5050 state source (1000B @ 10Hz), app[1] VDA 5050 orders sink
*.amr[*].numApps = 2
*.amr[*].app[0].typename = "UdpSourceApp"
*.amr[*].app[0].display-name = "vda-state"
*.amr[*].app[0].io.destAddress = "fms"
*.amr[*].app[0].io.destPort = 5050
*.amr[*].app[0].source.packetLength = 1000B
*.amr[*].app[0].source.productionInterval = uniform(90ms, 110ms)
*.amr[*].app[0].source.initialProductionOffset = uniform(0s, 100ms)
*.amr[*].app[1].typename = "UdpSinkApp"
*.amr[*].app[1].display-name = "vda-orders-rx"
*.amr[*].app[1].io.localPort = 5051
*.amr[*].app[1].sink.typename = "DeadlineSink"
*.amr[*].app[1].sink.trafficClass = "orders"
*.amr[*].app[1].sink.nominalDeadline = 50ms
*.amr[*].app[1].sink.appWatchdogTtl = 50ms
*.amr[*].app[1].sink.isZohFlow = false

# FMS: app[0] state sink, app[1] telemetry sink, app[2] DDS sink (Option 7B),
#      app[3..2+nAmr] one VDA 5050 order source per AMR (600B @ 5Hz Poisson)
*.fms.app[0].typename = "UdpSinkApp"
*.fms.app[0].display-name = "vda-state-rx"
*.fms.app[0].io.localPort = 5050
*.fms.app[0].sink.typename = "DeadlineSink"
*.fms.app[0].sink.trafficClass = "state"
*.fms.app[0].sink.nominalDeadline = 50ms
*.fms.app[0].sink.isZohFlow = true

*.fms.app[1].typename = "UdpSinkApp"
*.fms.app[1].display-name = "telemetry-rx"
*.fms.app[1].io.localPort = 5200
*.fms.app[1].sink.typename = "DeadlineSink"
*.fms.app[1].sink.trafficClass = "telemetry"
*.fms.app[1].sink.nominalDeadline = 100ms
*.fms.app[1].sink.isZohFlow = true

*.fms.app[2].typename = "UdpSinkApp"
*.fms.app[2].display-name = "dds-rx"
*.fms.app[2].io.localPort = 5100
*.fms.app[2].sink.typename = "DeadlineSink"
*.fms.app[2].sink.trafficClass = "dds"
*.fms.app[2].sink.nominalDeadline = 5ms
*.fms.app[2].sink.appWatchdogTtl = 5ms
*.fms.app[2].sink.isZohFlow = false
*.fms.app[3..].typename = "UdpSourceApp"
*.fms.app[3..].display-name = "vda-orders"
*.fms.app[3..].io.destAddress = "amr[" + string(parentIndex() - 3) + "]"
*.fms.app[3..].io.destPort = 5051
*.fms.app[3..].source.packetLength = 600B
*.fms.app[3..].source.productionInterval = exponential(200ms)
*.fms.app[3..].source.initialProductionOffset = uniform(0s, 200ms)

# Stations: app[0] DDS source (-> FMS, Option 7B, 200B @ 100Hz +/- 5% jitter),
#           app[1] Telemetry source (-> FMS, 1400B Poisson)
*.station[*].numApps = 2
*.station[*].app[0].typename = "UdpSourceApp"
*.station[*].app[0].display-name = "dds-tx"
*.station[*].app[0].io.destAddress = "fms"
*.station[*].app[0].io.destPort = 5100
*.station[*].app[0].source.packetLength = 200B
*.station[*].app[0].source.productionInterval = uniform(9.5ms, 10.5ms)
*.station[*].app[0].source.initialProductionOffset = uniform(0s, 10ms)
*.station[*].app[1].typename = "UdpSourceApp"
*.station[*].app[1].display-name = "telemetry-tx"
*.station[*].app[1].io.destAddress = "fms"
*.station[*].app[1].io.destPort = 5200
*.station[*].app[1].source.packetLength = 1400B

**.app[*].source.packetNameFormat = "%M-%m-%c"

# ---- TSN Switch Tagging & Bridging Pipeline ---------------------------------
*.fms.hasIncomingStreams = true
*.tsnSwitch.hasOutgoingStreams = true
*.tsnSwitch.bridging.streamIdentifier.identifier.mapping = [
    {stream: "orders",    packetFilter: expr(udp.destPort == 5051)},
    {stream: "dds",       packetFilter: expr(udp.destPort == 5100)},
    {stream: "state",     packetFilter: expr(udp.destPort == 5050)},
    {stream: "telemetry", packetFilter: expr(udp.destPort == 5200)}]
*.tsnSwitch.bridging.streamCoder.encoder.mapping = [
    {stream: "orders",    pcp: 6},
    {stream: "dds",       pcp: 4},
    {stream: "state",     pcp: 2},
    {stream: "telemetry", pcp: 0}]
*.tsnSwitch.bridging.directionReverser.reverser.excludeEncapsulationProtocols = ["ieee8021qctag"]
*.tsnSwitch.bridging.interfaceRelay.learner.typename = "RelayInterfaceLearner"

# ---- Statistics -------------------------------------------------------------
**.vector-recording = false
**.scalar-recording = true
**.bin-recording = true
**.statistic-recording = true

# =============================================================================
# Architectural Building Blocks
# =============================================================================

[Config Wired_FIFO]
abstract = true
description = "Best-effort: single DropTailQueue (80 packets) per egress port"
**.tsnSwitch.eth[*].macLayer.queue.typename = "DropTailQueue"
**.tsnSwitch.eth[*].macLayer.queue.packetCapacity = 80

[Config Wired_Prio]
abstract = true
description = "IEEE 802.1Q Strict Priority: 4 queues x 20 packets, gates held open"
**.tsnSwitch.hasEgressTrafficShaping = true
**.tsnSwitch.eth[*].macLayer.queue.numTrafficClasses = 4
**.tsnSwitch.eth[*].macLayer.queue.queue[*].typename = "DropTailQueue"
**.tsnSwitch.eth[*].macLayer.queue.queue[*].packetCapacity = 20
**.tsnSwitch.eth[*].macLayer.queue.transmissionGate[*].initiallyOpen = true
**.tsnSwitch.eth[*].macLayer.queue.transmissionGate[*].durations = []

[Config Wired_TAS]
abstract = true
description = "IEEE 802.1Qbv TAS: 1 ms cycle with disjoint windows (Orders 100us, DDS 200us, State 200us, Tel 500us)"
**.tsnSwitch.hasEgressTrafficShaping = true
**.tsnSwitch.eth[*].macLayer.queue.numTrafficClasses = 4
**.tsnSwitch.eth[*].macLayer.queue.queue[*].typename = "DropTailQueue"
**.tsnSwitch.eth[*].macLayer.queue.queue[*].packetCapacity = 20
**.tsnSwitch.eth[*].macLayer.queue.transmissionGate[*].initiallyOpen = true
**.tsnSwitch.eth[*].macLayer.queue.transmissionGate[3].durations = [100us, 900us]
**.tsnSwitch.eth[*].macLayer.queue.transmissionGate[3].offset = 0us
**.tsnSwitch.eth[*].macLayer.queue.transmissionGate[2].durations = [200us, 800us]
**.tsnSwitch.eth[*].macLayer.queue.transmissionGate[2].offset = 900us
**.tsnSwitch.eth[*].macLayer.queue.transmissionGate[1].durations = [200us, 800us]
**.tsnSwitch.eth[*].macLayer.queue.transmissionGate[1].offset = 700us
**.tsnSwitch.eth[*].macLayer.queue.transmissionGate[0].durations = [500us, 500us]
**.tsnSwitch.eth[*].macLayer.queue.transmissionGate[0].offset = 500us

[Config Radio_CSMA]
abstract = true
description = "Contentious IEEE 802.11g DCF (CSMA/CA)"

[Config Radio_Sched]
abstract = true
description = "Idealized conflict-free scheduled access (Spike S1: ScheduledDcf)"
**.wlan[*].mac.dcf.typename = "ScheduledDcf"
**.wlan[*].mac.dcf.channelAccess.cwMin = 0
**.wlan[*].mac.dcf.channelAccess.cwMax = 0
**.wlan[*].mac.dcf.cyclePhaseOffset = 0us
# Dynamic slotDuration and requiredExchangeTime by PHY rate (54Mbps -> 400us/260us; 12Mbps -> 1000us/820us)
**.wlan[*].mac.dcf.slotDuration = ${phyRate} == 54Mbps ? 400us : 1000us
**.wlan[*].mac.dcf.requiredExchangeTime = ${phyRate} == 54Mbps ? 260us : 820us
# Dynamic superframeDuration by (nAmr, phyRate) per SPEC-scheduled-dcf.md §2
**.wlan[*].mac.dcf.superframeDuration = ${phyRate} == 54Mbps ? \
    (par("<root>", "numAmrs") == 5 ? 3ms : (par("<root>", "numAmrs") == 10 ? 5ms : (par("<root>", "numAmrs") == 20 ? 9ms : (par("<root>", "numAmrs") == 40 ? 20ms : 48ms)))) : \
    (par("<root>", "numAmrs") == 5 ? 6ms : (par("<root>", "numAmrs") == 10 ? 11ms : (par("<root>", "numAmrs") == 20 ? 22ms : (par("<root>", "numAmrs") == 40 ? 48ms : 119ms))))
# AMR slot assignment: each AMR i gets 1 dedicated uplink slot at index i
*.amr[*].wlan[0].mac.dcf.slotIndex = ancestorIndex(3)
*.amr[*].wlan[0].mac.dcf.numAssignedSlots = 1
# AP slot assignment: contiguous downlink slots starting at index nAmr
*.ap.wlan[0].mac.dcf.slotIndex = par("<root>", "numAmrs")
*.ap.wlan[0].mac.dcf.slotStride = 1
*.ap.wlan[0].mac.dcf.numAssignedSlots = par("<root>", "numAmrs") <= 10 ? 1 : (par("<root>", "numAmrs") == 20 ? 2 : (par("<root>", "numAmrs") == 40 ? 8 : 39))

# =============================================================================
# Study Variables: Point Debugging & Locked P3 Factorial Sweep (Q5, Q8)
# =============================================================================
[Config Point]
abstract = true
*.numAmrs = ${nAmr=10}
*.numStations = ${nSta=4}
*.fms.numApps = 3 + ${nAmr}
**.wlan[*].bitrate = ${phyRate=54Mbps}
*.station[*].app[1].source.productionInterval = exponential(${telInterval=2000us})
*.station[*].app[1].source.initialProductionOffset = uniform(0s, ${telInterval})

[Config Sweep]
abstract = true
*.numAmrs = ${nAmr=5, 10, 20, 40, 80}
*.numStations = ${nSta=4}
*.fms.numApps = 3 + ${nAmr}
**.wlan[*].bitrate = ${phyRate=54Mbps, 12Mbps}
# 8-point telemetry sweep (22.4, 45.0, 60.0, 74.7, 85.0, 95.0, 110.0, 149.3 Mbps aggregate payload)
*.station[*].app[1].source.productionInterval = exponential(${telInterval=2000us, 996us, 747us, 600us, 527us, 472us, 407us, 300us})
*.station[*].app[1].source.initialProductionOffset = uniform(0s, ${telInterval})
repeat = 10
seed-set = ${repetition}

# =============================================================================
# Concrete Simulation Configurations (Cells 1-6)
# =============================================================================
[Config Cell1]
extends = Wired_FIFO, Radio_CSMA, Point
[Config Cell2]
extends = Wired_FIFO, Radio_Sched, Point
[Config Cell3]
extends = Wired_Prio, Radio_CSMA, Point
[Config Cell4]
extends = Wired_Prio, Radio_Sched, Point
[Config Cell5]
extends = Wired_TAS, Radio_CSMA, Point
[Config Cell6]
extends = Wired_TAS, Radio_Sched, Point

[Config Cell1_Sweep]
extends = Wired_FIFO, Radio_CSMA, Sweep
[Config Cell2_Sweep]
extends = Wired_FIFO, Radio_Sched, Sweep
[Config Cell3_Sweep]
extends = Wired_Prio, Radio_CSMA, Sweep
[Config Cell4_Sweep]
extends = Wired_Prio, Radio_Sched, Sweep
[Config Cell5_Sweep]
extends = Wired_TAS, Radio_CSMA, Sweep
[Config Cell6_Sweep]
extends = Wired_TAS, Radio_Sched, Sweep

[Config Debug]
abstract = true
**.vector-recording = true
*.recordPcap = true
