# =============================================================================
# Matrix Factory Twin - six-cell comparison (P2 skeleton)
# INET 4.6.0 / OMNeT++ 6.2+.  Module/param names were checked against the INET
# source, but this file has NOT been run yet. First job: get Cell1 to start.
#
#   Wired backbone      x  Radio
#   ---------------------------------------------------
#   FIFO       (Cell1)     CSMA/CA (Cell1, Cell3, Cell5)
#   802.1Q prio(Cell3)     Scheduled (Cell2, Cell4, Cell6)   <- NOT implemented
#   802.1Qbv   (Cell5)
#
# Run one cell:  opp_run -n <inet>/src:. -l <inet>/src/INET -c Cell1 -u Cmdenv omnetpp.ini
# Sweeps:        CellN_Sweep configs (see bottom) with opp_runall.
#                Sanity-check the expansion first: opp_run ... -c Cell1_Sweep -q runs
# =============================================================================

[General]
network = MatrixFactoryNetwork
sim-time-limit = 60s          # placeholder: set from the pilot
warmup-period = 5s            # placeholder: check with warm-up analysis
num-rngs = 2                  # rng-0: MACs/protocols, rng-1: traffic generators
**.app[*].source.rng-0 = 1    # same seed => same offered load in all six cells

# numAmrs / numStations / telemetry rate: see [Config Point] and [Config Sweep]
**.mgmt.numChannels = 2       # needed by the simplified 802.11 management

# ---- addressing: one flat L2 domain (AP and switch are bridges) --------------
*.configurator.config = xml("<config><interface hosts='*' address='10.0.x.x' netmask='255.255.0.0'/></config>")
*.configurator.assignDisjunctSubnetAddresses = false
# GlobalArp is already the default in WiredNetworkBase -> no ARP noise.

# ---- wireless environment: stationary, everyone in range of everyone ---------
**.constraintAreaMinX = 0m
**.constraintAreaMinY = 0m
**.constraintAreaMinZ = 0m
**.constraintAreaMaxX = 200m
**.constraintAreaMaxY = 200m
**.constraintAreaMaxZ = 0m
**.initFromDisplayString = false
*.ap.mobility.initialX = 100m
*.ap.mobility.initialY = 100m
*.ap.mobility.initialZ = 0m
*.amr[*].mobility.typename = "StationaryMobility"
*.amr[*].mobility.initialX = 100m + uniform(-30m, 30m)
*.amr[*].mobility.initialY = 100m + uniform(-30m, 30m)
*.amr[*].mobility.initialZ = 0m   # all within ~60 m of each other: no hidden nodes

*.ap.wlan[*].address = "10:00:00:00:00:00"
*.amr[*].wlan[*].mgmt.accessPointAddress = "10:00:00:00:00:00"
**.wlan[*].opMode = "g(erp)"          # PHY choice: calibrate in the pilot
**.wlan[*].bitrate = 54Mbps
**.wlan[*].radio.transmitter.power = 20mW             # INET default (13 dBm)
**.wlan[*].radio.transmitter.centerFrequency = 2.412GHz      # INET default Channel 1
**.wlan[*].radio.receiver.sensitivity = -85dBm
**.wlan[*].radio.receiver.snirThreshold = 4dB

# ---- traffic classes (ALL VALUES ARE PLACEHOLDERS: replace with sourced numbers)
#  class      dir          UDP port   PCP   priority
#  orders     FMS -> AMR   5051       6     highest
#  dds        stn -> stn   5100       4
#  state      AMR -> FMS   5050       2
#  telemetry  stn -> FMS   5200       0     background

# AMRs: app[0] state source, app[1] orders sink
*.amr[*].numApps = 2
*.amr[*].app[0].typename = "UdpSourceApp"
*.amr[*].app[0].display-name = "vda-state"
*.amr[*].app[0].io.destAddress = "fms"
*.amr[*].app[0].io.destPort = 5050
*.amr[*].app[0].source.packetLength = 1000B
*.amr[*].app[0].source.productionInterval = uniform(90ms, 110ms)
*.amr[*].app[0].source.initialProductionOffset = uniform(0s, 100ms)
*.amr[*].app[1].typename = "UdpSinkApp"
*.amr[*].app[1].display-name = "vda-orders-rx"
*.amr[*].app[1].io.localPort = 5051

# FMS: app[0] state sink, app[1] telemetry sink, app[2..] one order source per AMR
# (*.fms.numApps = 2 + nAmr is set in Point/Sweep)
*.fms.app[0].typename = "UdpSinkApp"
*.fms.app[0].display-name = "vda-state-rx"
*.fms.app[0].io.localPort = 5050
*.fms.app[1].typename = "UdpSinkApp"
*.fms.app[1].display-name = "telemetry-rx"
*.fms.app[1].io.localPort = 5200
*.fms.app[2..].typename = "UdpSourceApp"
*.fms.app[2..].display-name = "vda-orders"
*.fms.app[2..].io.destAddress = "amr[" + string(parentIndex() - 2) + "]"
*.fms.app[2..].io.destPort = 5051
*.fms.app[2..].source.packetLength = 600B
*.fms.app[2..].source.productionInterval = exponential(200ms)
*.fms.app[2..].source.initialProductionOffset = uniform(0s, 200ms)

# Stations: app[0] DDS source (to next station), app[1] DDS sink, app[2] telemetry source
*.station[*].numApps = 3
*.station[*].app[0].typename = "UdpSourceApp"
*.station[*].app[0].display-name = "dds-tx"
# (*.station[*].app[0].io.destAddress = next station in a ring: set in Point/Sweep)
*.station[*].app[0].io.destPort = 5100
*.station[*].app[0].source.packetLength = 200B
*.station[*].app[0].source.productionInterval = 10ms
*.station[*].app[0].source.initialProductionOffset = uniform(0s, 10ms)
*.station[*].app[1].typename = "UdpSinkApp"
*.station[*].app[1].display-name = "dds-rx"
*.station[*].app[1].io.localPort = 5100
*.station[*].app[2].typename = "UdpSourceApp"
*.station[*].app[2].display-name = "telemetry-tx"
*.station[*].app[2].io.destAddress = "fms"
*.station[*].app[2].io.destPort = 5200
*.station[*].app[2].source.packetLength = 1400B
*.station[*].app[2].source.initialProductionOffset = uniform(0s, 2ms)
# (telemetry interval: set in Point/Sweep; 2 ms with 1400 B ~ 5.6 Mbps per station)

# index suffix on packet names lets sinks detect missing/out-of-order packets
**.app[*].source.packetNameFormat = "%M-%m-%c"

# ---- tagging: ONE point (the switch), same pipeline in all six cells ---------
# Untagged frames from the radio side must be classified by the switch, so
# classes are identified by UDP port and encoded to PCP there. In the FIFO cell
# the PCP is set but ignored by the egress queue.
*.tsnSwitch.hasOutgoingStreams = true
*.tsnSwitch.bridging.streamIdentifier.identifier.mapping = [
    {stream: "orders",    packetFilter: expr(udp.destPort == 5051)},
    {stream: "dds",       packetFilter: expr(udp.destPort == 5100)},
    {stream: "state",     packetFilter: expr(udp.destPort == 5050)},
    {stream: "telemetry", packetFilter: expr(udp.destPort == 5200)}]
*.tsnSwitch.bridging.streamCoder.encoder.mapping = [
    {stream: "orders",    pcp: 6},
    {stream: "dds",       pcp: 4},
    {stream: "state",     pcp: 2},
    {stream: "telemetry", pcp: 0}]
# (4 traffic classes: INET's PCP->TC table maps PCP 0,2,4,6 -> TC 0,1,2,3)
# Don't forward the C-tag out of the switch (the AP/802.11 side must not see
# 0x8100 frames); the PCP request tag still steers the egress queue.
*.tsnSwitch.bridging.directionReverser.reverser.excludeEncapsulationProtocols = ["ieee8021qctag"]
# TsnSwitch disables MAC learning when streams are on, but AMR MACs live behind
# the AP and cannot be configured statically -> turn learning back on.
*.tsnSwitch.bridging.interfaceRelay.learner.typename = "RelayInterfaceLearner"

# ---- statistics ---------------------------------------------------------------
**.vector-recording = false              # per-packet vectors only in [Config Debug]
**.scalar-recording = true
**.histogram-recording = true
# useful per-class sinks: app[*].sink.packetLifeTime (e2e delay), .packets (count),
# .missingPacketIndices (loss), .packetJitter.  Loss = sent - received.


# =============================================================================
# Building blocks
# =============================================================================

# ---- wired: single FIFO ------------------------------------------------------
[Config Wired_FIFO]
abstract = true
description = "Best-effort: one FIFO per port"
**.tsnSwitch.eth[*].macLayer.queue.typename = "DropTailQueue"
**.tsnSwitch.eth[*].macLayer.queue.packetCapacity = 80      # = 4 classes x 20 (fair buffer)

# ---- wired: 802.1Q strict priority (same shaper module, gates always open) ---
[Config Wired_Prio]
abstract = true
description = "802.1Q priority: 4 classes, strict priority, no gating"
**.tsnSwitch.hasEgressTrafficShaping = true
**.tsnSwitch.eth[*].macLayer.queue.numTrafficClasses = 4
**.tsnSwitch.eth[*].macLayer.queue.queue[*].typename = "DropTailQueue"
**.tsnSwitch.eth[*].macLayer.queue.queue[*].packetCapacity = 20
**.tsnSwitch.eth[*].macLayer.queue.transmissionGate[*].initiallyOpen = true
**.tsnSwitch.eth[*].macLayer.queue.transmissionGate[*].durations = []   # never closes

# ---- wired: 802.1Qbv TAS, 1 ms cycle -----------------------------------------
# Gate g serves TC g. A window [s, s+w) is written as durations=[w, 1ms-w] with
# initiallyOpen=true and offset = 1ms - s (offset = position inside the period at t=0).
#   TC3 orders    [  0, 100) us
#   TC2 dds       [100, 300) us
#   TC1 state     [300, 500) us
#   TC0 telemetry [500,1000) us
# CHECK with the gateState:vector statistic that windows land where intended.
[Config Wired_TAS]
abstract = true
description = "802.1Qbv: exclusive per-class windows in a 1 ms cycle"
**.tsnSwitch.hasEgressTrafficShaping = true
**.tsnSwitch.eth[*].macLayer.queue.numTrafficClasses = 4
**.tsnSwitch.eth[*].macLayer.queue.queue[*].typename = "DropTailQueue"
**.tsnSwitch.eth[*].macLayer.queue.queue[*].packetCapacity = 20
**.tsnSwitch.eth[*].macLayer.queue.transmissionGate[*].initiallyOpen = true
**.tsnSwitch.eth[*].macLayer.queue.transmissionGate[3].durations = [100us, 900us]
**.tsnSwitch.eth[*].macLayer.queue.transmissionGate[3].offset = 0us
**.tsnSwitch.eth[*].macLayer.queue.transmissionGate[2].durations = [200us, 800us]
**.tsnSwitch.eth[*].macLayer.queue.transmissionGate[2].offset = 900us
**.tsnSwitch.eth[*].macLayer.queue.transmissionGate[1].durations = [200us, 800us]
**.tsnSwitch.eth[*].macLayer.queue.transmissionGate[1].offset = 700us
**.tsnSwitch.eth[*].macLayer.queue.transmissionGate[0].durations = [500us, 500us]
**.tsnSwitch.eth[*].macLayer.queue.transmissionGate[0].offset = 500us

# ---- radio: contentious 802.11 DCF/CSMA-CA -----------------------------------
[Config Radio_CSMA]
abstract = true
description = "IEEE 802.11 DCF"
# defaults: INET Ieee80211Mac with DCF. Nothing else to set.

# ---- radio: idealized scheduled access (TO BE IMPLEMENTED) -------------------
# INET's PCF and HCCA are stubs, so there is no off-the-shelf scheduled mode.
# Candidates to spike (1 day each):
#   A) slot-gate the transmit path of each wlan MAC (PeriodicGate per AMR + AP
#      downlink slot) so only one station can start a frame at a time: keeps
#      framing/ACK/preamble identical to the CSMA cells.
#   B) custom MAC (TDMA / polling).
# The tripwire below makes Cells 2/4/6 fail loudly instead of silently running
# CSMA. Delete it when the scheduled MAC exists.
[Config Radio_Sched]
abstract = true
description = "Idealized conflict-free scheduled access (placeholder)"
**.wlan[*].mac.typename = "SCHEDULED_MAC_NOT_IMPLEMENTED"


# =============================================================================
# Study variables. Defined and referenced in the SAME config on purpose.
# =============================================================================
[Config Point]
abstract = true
*.numAmrs = ${nAmr=10}
*.numStations = ${nSta=4}
*.fms.numApps = 2 + ${nAmr}
*.station[*].app[0].io.destAddress = "station[" + string((ancestorIndex(2) + 1) % ${nSta}) + "]"
*.station[*].app[2].source.productionInterval = exponential(${telInterval=2ms})

# P3 grid is a PLACEHOLDER: fix levels after the pilot (4 x 3 x 10 = 120 runs/cell)
[Config Sweep]
abstract = true
*.numAmrs = ${nAmr=5,10,20,40}
*.numStations = ${nSta=4}
*.fms.numApps = 2 + ${nAmr}
*.station[*].app[0].io.destAddress = "station[" + string((ancestorIndex(2) + 1) % ${nSta}) + "]"
*.station[*].app[2].source.productionInterval = exponential(${telInterval=2ms,600us,300us})
repeat = 10
seed-set = ${repetition}


# =============================================================================
# The six cells. OMNeT++ 6 'extends' accepts several bases. Every config already
# inherits [General] implicitly, so do not list General here.
# =============================================================================
[Config Cell1]
description = "Cell 1: FIFO + CSMA/CA"
extends = Wired_FIFO, Radio_CSMA, Point
[Config Cell2]
description = "Cell 2: FIFO + scheduled"
extends = Wired_FIFO, Radio_Sched, Point
[Config Cell3]
description = "Cell 3: 802.1Q priority + CSMA/CA"
extends = Wired_Prio, Radio_CSMA, Point
[Config Cell4]
description = "Cell 4: 802.1Q priority + scheduled"
extends = Wired_Prio, Radio_Sched, Point
[Config Cell5]
description = "Cell 5: 802.1Qbv + CSMA/CA"
extends = Wired_TAS, Radio_CSMA, Point
[Config Cell6]
description = "Cell 6: 802.1Qbv + scheduled"
extends = Wired_TAS, Radio_Sched, Point

[Config Cell1_Sweep]
extends = Wired_FIFO, Radio_CSMA, Sweep
[Config Cell2_Sweep]
extends = Wired_FIFO, Radio_Sched, Sweep
[Config Cell3_Sweep]
extends = Wired_Prio, Radio_CSMA, Sweep
[Config Cell4_Sweep]
extends = Wired_Prio, Radio_Sched, Sweep
[Config Cell5_Sweep]
extends = Wired_TAS, Radio_CSMA, Sweep
[Config Cell6_Sweep]
extends = Wired_TAS, Radio_Sched, Sweep

# Per-packet vectors + pcap, for hand validation. Use as: [Config Cell1_Debug] extends = Cell1, Debug
[Config Debug]
abstract = true
**.vector-recording = true
*.recordPcap = true
