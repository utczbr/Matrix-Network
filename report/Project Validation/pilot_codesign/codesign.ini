include /home/stuart/Documentos/Learn/NetWork/Matrix/simulations/omnetpp.ini

[Config Cell4_N40_K12]
description = "Co-designed Cell 4 (N=40, 12 Mbps): K=12 AP slots within unchanged T_super=42ms"
extends = Wired_Prio, Radio_Sched
*.numAmrs = ${nAmr=40}
*.numStations = ${nSta=4}
*.fms.numApps = 3 + ${nAmr}
*.wirelessPhyRate = ${phyRate=12Mbps}
**.wlan[*].bitrate = ${phyRate}
*.station[*].app[1].source.productionInterval = exponential(${telInterval=2000us})
*.station[*].app[1].source.initialProductionOffset = uniform(0s, ${telInterval})
repeat = 3
seed-set = ${repetition}

**.wlan[*].mac.dcf.superframeDuration = 42ms
*.amr[*].wlan[0].mac.dcf.slotStartOffset = ancestorIndex(3) * 850us
*.amr[*].wlan[0].mac.dcf.numAssignedSlots = 1
*.ap.wlan[0].mac.dcf.slotStartOffset = 34000us
*.ap.wlan[0].mac.dcf.slotDuration = 560us
*.ap.wlan[0].mac.dcf.slotStrideTime = 560us
*.ap.wlan[0].mac.dcf.numAssignedSlots = 12
*.ap.wlan[0].mac.dcf.requiredExchangeTime = 550us

[Config Cell4_N80_SplitAP]
description = "Co-designed Cell 4 (N=80, 12 Mbps): 2 split AP sub-blocks (K_half=21 each, 46ms half-cycle, T_super=92ms)"
extends = Wired_Prio, Radio_Sched
*.numAmrs = ${nAmr=80}
*.numStations = ${nSta=4}
*.fms.numApps = 3 + ${nAmr}
*.wirelessPhyRate = ${phyRate=12Mbps}
**.wlan[*].bitrate = ${phyRate}
*.station[*].app[1].source.productionInterval = exponential(${telInterval=2000us})
*.station[*].app[1].source.initialProductionOffset = uniform(0s, ${telInterval})
repeat = 3
seed-set = ${repetition}

**.wlan[*].mac.dcf.superframeDuration = 92ms
*.amr[*].wlan[0].mac.dcf.slotStartOffset = ancestorIndex(3) < 40 ? (ancestorIndex(3) * 850us) : (46000us + (ancestorIndex(3) - 40) * 850us)
*.amr[*].wlan[0].mac.dcf.numAssignedSlots = 1
*.ap.wlan[0].mac.dcf.slotStartOffset = 34000us
*.ap.wlan[0].mac.dcf.slotDuration = 11760us
*.ap.wlan[0].mac.dcf.slotStrideTime = 46000us
*.ap.wlan[0].mac.dcf.numAssignedSlots = 2
*.ap.wlan[0].mac.dcf.requiredExchangeTime = 550us

