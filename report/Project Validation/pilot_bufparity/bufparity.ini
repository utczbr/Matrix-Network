include /home/stuart/Documentos/Learn/NetWork/Matrix/simulations/omnetpp.ini

[Config Cell3_BufParity]
description = "Buffer-parity ablation on Cell 3 (802.1Q + CSMA, N=40, 54 Mbps): TC0 queue capacity 80 pkts (matching FIFO 80-pkt pool) while TC1..TC3 remain 20 pkts"
extends = Wired_Prio, Radio_CSMA
*.numAmrs = ${nAmr=40}
*.numStations = ${nSta=4}
*.fms.numApps = 3 + ${nAmr}
*.wirelessPhyRate = ${phyRate=54Mbps}
**.wlan[*].bitrate = ${phyRate}
*.station[*].app[1].source.productionInterval = exponential(${telInterval=527us, 472us, 300us})
*.station[*].app[1].source.initialProductionOffset = uniform(0s, ${telInterval})
repeat = 3
seed-set = ${repetition}

*.tsnSwitch.eth[0].macLayer.queue.queue[0].packetCapacity = 80

