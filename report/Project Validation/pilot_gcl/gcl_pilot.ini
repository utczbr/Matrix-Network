include /home/stuart/Documentos/Learn/NetWork/Matrix/simulations/omnetpp.ini

[Config Cell6_GCL_Rebal]
description = "Port-specific eth[0] GCL rebalancing in Cell 6 (N=40, 54 Mbps): TC3 closed, TC2 [0,100)us, TC1 [100,280)us, TC0 [280,1000)us (67.20 Mbps cap); eth[1] unchanged"
extends = Wired_TAS, Radio_Sched
*.numAmrs = ${nAmr=40}
*.numStations = ${nSta=4}
*.fms.numApps = 3 + ${nAmr}
*.wirelessPhyRate = ${phyRate=54Mbps}
**.wlan[*].bitrate = ${phyRate}
*.station[*].app[1].source.productionInterval = exponential(${telInterval=996us, 747us, 600us, 527us})
*.station[*].app[1].source.initialProductionOffset = uniform(0s, ${telInterval})
repeat = 3
seed-set = ${repetition}

# Port-specific eth[0] (tsnSwitch -> fms) GCL override:
# TC3 (Orders) never traverses eth[0] -> closed permanently
*.tsnSwitch.eth[0].macLayer.queue.transmissionGate[3].initiallyOpen = false
*.tsnSwitch.eth[0].macLayer.queue.transmissionGate[3].durations = []
*.tsnSwitch.eth[0].macLayer.queue.transmissionGate[3].offset = 0us
# TC2 (DDS): [0, 100) us -> 4 frames/ms (4000 fps vs 400 fps offered)
*.tsnSwitch.eth[0].macLayer.queue.transmissionGate[2].initiallyOpen = true
*.tsnSwitch.eth[0].macLayer.queue.transmissionGate[2].durations = [100us, 900us]
*.tsnSwitch.eth[0].macLayer.queue.transmissionGate[2].offset = 0us
# TC1 (State): [100, 280) us -> 2 frames/ms (2000 fps vs 400 fps offered at N=40)
*.tsnSwitch.eth[0].macLayer.queue.transmissionGate[1].initiallyOpen = true
*.tsnSwitch.eth[0].macLayer.queue.transmissionGate[1].durations = [180us, 820us]
*.tsnSwitch.eth[0].macLayer.queue.transmissionGate[1].offset = 900us
# TC0 (Telemetry): [280, 1000) us = 720 us -> 6 frames/ms = 67.20 Mbps payload (L2 & wire)
*.tsnSwitch.eth[0].macLayer.queue.transmissionGate[0].initiallyOpen = true
*.tsnSwitch.eth[0].macLayer.queue.transmissionGate[0].durations = [720us, 280us]
*.tsnSwitch.eth[0].macLayer.queue.transmissionGate[0].offset = 720us
# Note: eth[1] (tsnSwitch -> ap) inherits Wired_TAS unchanged (TC3 [0,100) us open for Orders).

